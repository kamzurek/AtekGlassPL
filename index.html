<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Ustawienie motywu przed pierwszym wyświetleniem strony. -->
    <script>
        (() => {
            let theme = null;
            try { theme = localStorage.getItem('atekglass-theme'); } catch {}
            if (theme !== 'dark' && theme !== 'light') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>

    <!-- Ikony -->
    <link rel="icon" href="/atekglass.ico" sizes="any">
    <!-- (opcjonalnie) -->
    <!-- <link rel="apple-touch-icon" href="/apple-touch-icon.png"> -->

    <!-- Kanoniczny URL (apex) -->
    <link rel="canonical" href="https://atekglass.pl/">

    <!-- Podstawowe SEO -->
    <title>ATEK-GLASS – Hurtownia Szkła Rybnik</title>
    <meta name="description" content="Hurtownia szkła w Rybniku i okolicach: kabiny prysznicowe, lustra, lacobel, balustrady i szkło na wymiar. Pomiar, produkcja, montaż. Szybkie terminy i gwarancja. Zadzwoń: +48 731 721 706.">
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0b2a4a" />

    <!-- Hreflang -->
    <link rel="alternate" href="https://atekglass.pl/" hreflang="pl-PL">
    <link rel="alternate" href="https://atekglass.pl/" hreflang="x-default">

    <!-- Open Graph / Facebook -->

    <meta property="og:image:height" content="630">

            "areaServed":["Rybnik","Żory","Wodzisław Śląski","Jastrzębie-Zdrój","powiat rybnicki"],
